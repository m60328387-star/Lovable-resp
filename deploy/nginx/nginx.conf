events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server_tokens off;

    # رؤوس الأمان الأساسية لكل الاستجابات
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # حد معدل الطلبات: يحمي الدخول ونقاط /api/public من التخمين والإغراق
    limit_req_zone $binary_remote_addr zone=weaver_auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=weaver_api:10m rate=60r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=weaver_conn:10m;

    upstream app {
        server app:3000;
    }

    upstream runtime {
        server runtime:4100;
    }

    # Use the configured domain if available; otherwise accept any host.
    server_name_in_redirect off;

    server {
        listen 80;
        server_name ${WEAVER_DOMAIN};

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location ^~ /api/public/ {
            limit_req zone=weaver_api burst=30 nodelay;
            limit_conn weaver_conn 40;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location ^~ /api/public/rt/ {
            proxy_pass http://runtime/p/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 86400;
        }

        # If no domain is configured, serve HTTP directly.
        ${WEAVER_SSL_DISABLED:+# }location / {
        ${WEAVER_SSL_DISABLED:+# }    return 301 https://$host$request_uri;
        ${WEAVER_SSL_DISABLED:+# }}

        ${WEAVER_SSL_DISABLED:=# }location / {
        ${WEAVER_SSL_DISABLED:=# }    proxy_pass http://app;
        ${WEAVER_SSL_DISABLED:=# }    proxy_http_version 1.1;
        ${WEAVER_SSL_DISABLED:=# }    proxy_set_header Upgrade $http_upgrade;
        ${WEAVER_SSL_DISABLED:=# }    proxy_set_header Connection "upgrade";
        ${WEAVER_SSL_DISABLED:=# }    proxy_set_header Host $http_host;
        ${WEAVER_SSL_DISABLED:=# }    proxy_set_header X-Forwarded-Host $http_host;
        ${WEAVER_SSL_DISABLED:=# }    proxy_set_header X-Real-IP $remote_addr;
        ${WEAVER_SSL_DISABLED:=# }    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        ${WEAVER_SSL_DISABLED:=# }    proxy_set_header X-Forwarded-Proto $scheme;
        ${WEAVER_SSL_DISABLED:=# }    proxy_read_timeout 86400;
        ${WEAVER_SSL_DISABLED:=# }}
    }

    ${WEAVER_SSL_DISABLED:+# }server {
    ${WEAVER_SSL_DISABLED:+# }    listen 443 ssl http2;
    ${WEAVER_SSL_DISABLED:+# }    server_name ${WEAVER_DOMAIN};
    ${WEAVER_SSL_DISABLED:+# }
    ${WEAVER_SSL_DISABLED:+# }    ssl_certificate /etc/letsencrypt/live/${WEAVER_DOMAIN}/fullchain.pem;
    ${WEAVER_SSL_DISABLED:+# }    ssl_certificate_key /etc/letsencrypt/live/${WEAVER_DOMAIN}/privkey.pem;
    ${WEAVER_SSL_DISABLED:+# }
    ${WEAVER_SSL_DISABLED:+# }    ssl_protocols TLSv1.2 TLSv1.3;
    ${WEAVER_SSL_DISABLED:+# }    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ${WEAVER_SSL_DISABLED:+# }    ssl_prefer_server_ciphers on;
    ${WEAVER_SSL_DISABLED:+# }    ssl_session_cache shared:SSL:10m;
    ${WEAVER_SSL_DISABLED:+# }    ssl_session_timeout 10m;
    ${WEAVER_SSL_DISABLED:+# }
    ${WEAVER_SSL_DISABLED:+# }    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    ${WEAVER_SSL_DISABLED:+# }    add_header X-Content-Type-Options "nosniff" always;
    ${WEAVER_SSL_DISABLED:+# }    add_header X-Frame-Options "SAMEORIGIN" always;
    ${WEAVER_SSL_DISABLED:+# }    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    ${WEAVER_SSL_DISABLED:+# }
    ${WEAVER_SSL_DISABLED:+# }    location ^~ /api/public/rt/ {
    ${WEAVER_SSL_DISABLED:+# }        proxy_pass http://runtime/p/;
    ${WEAVER_SSL_DISABLED:+# }        proxy_http_version 1.1;
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header Upgrade $http_upgrade;
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header Connection "upgrade";
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header Host $http_host;
    ${WEAVER_SSL_DISABLED:+# }        proxy_read_timeout 86400;
    ${WEAVER_SSL_DISABLED:+# }    }
    ${WEAVER_SSL_DISABLED:+# }
    ${WEAVER_SSL_DISABLED:+# }    location / {
    ${WEAVER_SSL_DISABLED:+# }        proxy_pass http://app;
    ${WEAVER_SSL_DISABLED:+# }        proxy_http_version 1.1;
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header Upgrade $http_upgrade;
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header Connection "upgrade";
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header Host $http_host;
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header X-Forwarded-Host $http_host;
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header X-Real-IP $remote_addr;
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header X-Forwarded-Proto $scheme;
    ${WEAVER_SSL_DISABLED:+# }        proxy_read_timeout 86400;
    ${WEAVER_SSL_DISABLED:+# }    }
    ${WEAVER_SSL_DISABLED:+# }
    ${WEAVER_SSL_DISABLED:+# }    location /api/ {
    ${WEAVER_SSL_DISABLED:+# }        proxy_pass http://app;
    ${WEAVER_SSL_DISABLED:+# }        proxy_http_version 1.1;
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header Host $http_host;
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header X-Forwarded-Host $http_host;
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header X-Real-IP $remote_addr;
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    ${WEAVER_SSL_DISABLED:+# }        proxy_set_header X-Forwarded-Proto $scheme;
    ${WEAVER_SSL_DISABLED:+# }        proxy_read_timeout 300s;
    ${WEAVER_SSL_DISABLED:+# }    }
    ${WEAVER_SSL_DISABLED:+# }}
}

# إعداد nginx على مضيف Contabo (خارج Docker) الذي يمرّر المنفذ 80 إلى الحاوية على 8081.
# انسخه إلى /etc/nginx/sites-available/weaver ثم:
#   ln -sf /etc/nginx/sites-available/weaver /etc/nginx/sites-enabled/weaver
#   nginx -t && systemctl reload nginx
#
# ملاحظة: رؤوس الأمان يجب أن تكون هنا أيضاً، لأن هذا هو nginx الذي يراه الزائر
# (nginx داخل Docker خلفه ولا تصل رؤوسه بالضرورة إلى المتصفح).

limit_req_zone $binary_remote_addr zone=host_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=host_auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # لتجديد شهادات Let's Encrypt عند ربط دومين
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ^~ /api/public/ {
        limit_req zone=host_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location = /auth {
        limit_req zone=host_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
